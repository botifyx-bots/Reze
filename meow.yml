version: "3.9"

services:
  redis:
    image: redis:alpine
    container_name: Reze_redis
    network_mode: host
    volumes:
      - redis_data:/data
    restart: unless-stopped

  Reze:
    build: .
    image: Reze:${TAG}
    container_name: Reze
    network_mode: host # or bridge or whatever your network is
    depends_on:
      - redis
    pull_policy: never
  restarter:
    image: docker:cli
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
    command: ["/bin/sh", "-c", "while true; do sleep 43200; docker restart Reze; done"] # restart every 12 hours
    restart: unless-stopped
    network_mode: host

networks:
  default: 
    external: true
    name: host

volumes:
  redis_data:
